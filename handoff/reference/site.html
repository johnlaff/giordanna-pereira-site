<style>
  :root{
    --navy:#2E3A48;--navy-deep:#232D38;--paper:#F1F2F0;--sand:#CDBCA4;--mist:#AFC0CC;
    --ink:#232D38;--ink-soft:#5A646E;--line:rgba(46,58,72,.16);--line-light:rgba(242,239,233,.22);
    --gutter:24px;--ease:cubic-bezier(.22,.61,.36,1);
    --fs-hero:48px;--fs-page:40px;--fs-sec:34px;--fs-about:32px;--fs-cta:34px;--fs-form:28px;--fs-card:24px;--fs-pn:20px;--fs-cau:22px;--fs-lead:16px;--sp-sec:64px;--sp-page:48px;--hdr-h:86px;
  }
  @media(min-width:700px){:root{--gutter:40px;--fs-hero:76px;--fs-page:58px;--fs-sec:48px;--fs-about:42px;--fs-cta:50px;--fs-form:34px;--fs-card:28px;--fs-pn:24px;--fs-cau:26px;--fs-lead:17px;--sp-sec:88px;--sp-page:64px;--hdr-h:66px}}
  @media(min-width:1100px){:root{--gutter:52px;--fs-hero:108px;--fs-page:76px;--fs-sec:62px;--fs-about:54px;--fs-cta:68px;--fs-form:40px;--fs-card:32px;--fs-pn:30px;--fs-cau:30px;--fs-lead:18px;--sp-sec:120px;--sp-page:72px;--hdr-h:66px}}
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--navy-deep)}
  body{background:var(--paper);color:var(--ink);font-family:Jost,"Century Gothic",Futura,sans-serif;font-weight:300;font-size:17px;line-height:1.65;min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
  body.lock{overflow:hidden}
  ::selection{background:var(--sand);color:var(--navy-deep)}
  img{max-width:100%;display:block}
  p{text-wrap:pretty}
  h1,h2,h3{text-wrap:balance}
  .serif,h1,h2,h3,.brand-name,.card-txt b,.pn a b,.ftr-cau b,.f-ok b,.card-cap b{font-variant-numeric:lining-nums}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a,button{-webkit-tap-highlight-color:transparent}
  .nav a:active,.btn:active,.card:active{opacity:.7}
  :focus-visible{outline:2px solid var(--navy);outline-offset:3px}
  .hdr :focus-visible,.hero :focus-visible,.about :focus-visible,.ftr :focus-visible,.lb :focus-visible,.btn:focus-visible{outline-color:var(--sand)}
  .shell{max-width:1240px;margin:0 auto;padding:0 var(--gutter)}
  .serif{font-family:"Cormorant Garamond",Garamond,Georgia,serif}
  .eyebrow{font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:400;color:var(--ink-soft)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .skip{position:absolute;left:-9999px;z-index:100;background:var(--sand);color:var(--navy-deep);padding:12px 22px;font-size:15px;font-weight:500;text-decoration:none}
  .skip:focus{left:16px;top:16px;position:fixed}
  @media(max-width:640px){body{font-size:17px}}

  /* ============ HEADER ============ */
  .hdr{position:fixed;inset:0 0 auto;z-index:50;-webkit-tap-highlight-color:transparent;display:flex;justify-content:space-between;align-items:center;padding:16px var(--gutter);color:#F1F2F0;background:transparent;transition:background .35s var(--ease),box-shadow .35s}
  .hdr.solid{background:rgba(35,45,56,.97);box-shadow:0 1px 0 rgba(242,239,233,.08)}
  .hdr.snap{transition:none}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
  .mark{width:26px;height:26px;position:relative;flex:none}
  .mark i{position:absolute;width:12px;height:12px;border-radius:50%;background:currentColor}
  .mark i:nth-child(1){left:0;top:0;opacity:.55}
  .mark i:nth-child(2){right:0;top:0}
  .mark i:nth-child(3){left:0;bottom:0;border-radius:0 0 0 12px}
  .mark i:nth-child(4){right:0;bottom:0;opacity:.35;border-radius:0 0 12px 0}
  .brand-txt{display:flex;flex-direction:column;line-height:1.05}
  .brand-name{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:20px;letter-spacing:.02em}
  .brand-cau{font-size:11px;letter-spacing:.1em;opacity:.8;margin-top:3px;font-weight:400;padding-left:.1em}
  .nav{display:flex;gap:clamp(14px,3vw,34px)}
  .nav a{color:inherit;text-decoration:none;font-size:13px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;opacity:.82;padding:8px 2px;position:relative;transition:opacity .25s}
  .nav a::after{content:"";position:absolute;left:2px;right:2px;bottom:4px;height:1px;background:var(--sand);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--ease)}
  .nav a:hover,.nav a[aria-current="page"]{opacity:1}
  .nav a[aria-current="page"]::after{transform:scaleX(1)}
  .nav a:focus-visible{outline:2px solid currentColor;outline-offset:3px}
  @media(max-width:640px){
    .hdr{flex-direction:column;align-items:flex-start;gap:2px;padding:12px var(--gutter)}
    .nav{width:100%;gap:22px}
    .nav a{font-size:11px;letter-spacing:.16em}
  }

  /* ============ PAGE SCAFFOLD ============ */
  main{flex:1 0 auto}
  .ftr{flex:none}
  .page-head{padding:calc(var(--hdr-h) + var(--sp-page)) 0 clamp(24px,3.5vh,36px)}
  .page-head h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:var(--fs-page);line-height:1.12;letter-spacing:.005em}
  .page-head p{color:var(--ink-soft);max-width:56ch;margin-top:14px}
  .page-head p.kind{font-size:17px;margin-top:10px}
  .page-head p.wide{max-width:none}
  .sec-head{display:flex;align-items:baseline;gap:22px;padding:clamp(60px,9vh,110px) 0 clamp(28px,4vh,44px);flex-wrap:wrap}
  .sec-title{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:var(--fs-sec);line-height:1.1}
  .sec-rule{flex:1;height:1px;background:var(--line);align-self:center;min-width:40px}
  @media(max-width:640px){.sec-rule{flex-basis:100%}}
  .rv{opacity:0;transform:translateY(28px);transition:opacity .9s var(--ease),transform .9s var(--ease)}

  /* ============ HERO ============ */
  .hero{position:relative;height:100vh;height:100svh;min-height:560px;display:flex;align-items:flex-end;background:var(--navy-deep);padding:0 var(--gutter)}
  .hero-bg{position:absolute;inset:0;overflow:clip}
  .hero-img{width:106%;height:112%;margin:-6% -3%;background:var(--hero-img) center 35%/cover no-repeat;animation:kenburns 26s ease-in-out infinite alternate}
  @keyframes kenburns{from{transform:scale(1)}to{transform:scale(1.09) translateY(-1.6%)}}
  .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(35,45,56,.62) 0%,rgba(35,45,56,0) 22%),linear-gradient(15deg,rgba(35,45,56,.88) 0%,rgba(35,45,56,.42) 44%,rgba(35,45,56,.06) 75%)}
  .hero-content{position:relative;z-index:2;color:var(--paper);padding:0 0 clamp(96px,16vh,150px);max-width:1200px}
  .hero-eyebrow{font-size:13px;letter-spacing:.34em;text-transform:uppercase;font-weight:400;color:var(--sand);margin-bottom:18px}
  .hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:var(--fs-hero);line-height:1.06}
  .hero h1 em{font-style:normal;font-weight:400;color:var(--mist)}
  .hero-sub{margin-top:26px;max-width:44ch;font-size:var(--fs-lead);color:rgba(242,239,233,.92)}
  .hero-foot{z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px 20px;flex-wrap:wrap;border-top:1px solid var(--line-light);padding:16px 0 22px;position:absolute;left:var(--gutter);right:var(--gutter);bottom:0;color:rgba(242,239,233,.8);font-size:13px;letter-spacing:.18em;text-transform:uppercase}
  .hero-cap{text-transform:none;letter-spacing:.02em;font-size:13px}
  .scrollcue{display:inline-flex;align-items:center;gap:10px}
  .scrollcue b{display:block;width:1px;height:34px;background:var(--sand);animation:drip 2.2s ease-in-out infinite;transform-origin:top}
  @keyframes drip{0%{transform:scaleY(0)}45%{transform:scaleY(1)}100%{transform:scaleY(0);transform-origin:bottom}}
  @media(max-width:640px){.hero{min-height:640px}.hero-foot span:last-child{display:none}}

  /* rail social do hero (Cerrá) */
  .rail{position:absolute;right:16px;top:50%;transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;gap:6px}
  .rail a{position:relative;display:flex;align-items:center;justify-content:center;width:40px;height:40px;color:rgba(242,239,233,.72);transition:color .3s}
  .rail a svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .rail a span{position:absolute;right:calc(100% + 2px);top:50%;transform:translate(6px,-50%);white-space:nowrap;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--paper);opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease)}
  .rail a:hover,.rail a:focus-visible{color:var(--paper)}
  .rail a:hover span,.rail a:focus-visible span{opacity:1;transform:translate(0,-50%)}
  .rail::before{content:"";width:1px;height:38px;background:rgba(242,239,233,.35);margin:0 auto 6px}
  .rail::after{content:"";width:1px;height:38px;background:rgba(242,239,233,.35);margin:6px auto 0}
  @media(max-width:640px){.rail{top:104px;transform:none;right:10px;gap:0}.rail a{width:38px;height:38px}.rail::before,.rail::after{display:none}.rail a span{display:none}}

  /* ============ HOME: sobre / ferramentas / depoimentos / cta ============ */
  .about{background:var(--navy);color:var(--paper);position:relative;overflow:clip;padding:var(--sp-sec) var(--gutter)}
  .about .shell,.quotes .shell{padding-inline:0}
  .about::before,.about::after{content:"";position:absolute;width:46vw;height:46vw;max-width:560px;max-height:560px;border-radius:50%;pointer-events:none}
  .about::before{background:var(--navy-deep);right:-12vw;top:-18vw}
  .about::after{left:-14vw;bottom:-24vw;border:1px solid rgba(205,188,164,.25)}
  .about-grid{position:relative;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,6fr);gap:clamp(28px,5vw,72px);align-items:center}
  .about-photo{position:relative;isolation:isolate} /* contexto de empilhamento fixo: a moldura (::after, z-index:-1) fica atrás da foto, nunca atrás da seção */
  .about-photo::after{content:"";position:absolute;inset:14px -14px -14px 14px;border:1px solid rgba(205,188,164,.4);z-index:-1}
  .about h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:var(--fs-about);line-height:1.12;margin-bottom:22px}
  .about h2 em{color:var(--sand);font-style:normal}
  .about p{color:rgba(242,239,233,.82);max-width:56ch;margin-bottom:16px;font-size:17px}
  .cred{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:rgba(242,239,233,.14);border:1px solid rgba(242,239,233,.14);margin-top:26px}
  .cred div{background:var(--navy);padding:16px 18px}
  .cred b{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--sand);font-weight:500;margin-bottom:5px}
  .cred span{font-size:15px;color:rgba(242,239,233,.9)}
  @media(max-width:820px){.about-grid{grid-template-columns:1fr}.about-photo{max-width:340px}}
  @media(max-width:640px){.cred{grid-template-columns:1fr}}
  .tools{padding-bottom:clamp(40px,6vh,72px)}
  .tools-grid{list-style:none;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
  .tool{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:400;min-height:72px;padding:14px 16px;display:flex;align-items:center;justify-content:center;text-align:center;border:1px solid transparent}
  .tool.t1{background:var(--navy);color:var(--paper);border-color:var(--navy)}
  .tool.t2{background:var(--mist);color:var(--ink);border-color:var(--mist)}
  .tool.t3{background:#FFFFFF;color:var(--ink);border-color:var(--line)}
  @media(max-width:820px){.tools-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:400px){.tool{min-height:60px;padding:12px 10px;letter-spacing:.1em}}
  .quotes{background:#E4E8EA;padding:var(--sp-sec) var(--gutter)}
  .quotes .sec-head{padding-top:0}
  /* carrossel de depoimentos: scroll-snap nativo + arraste no mouse; 3 cards centrais em destaque, laterais esmaecidas */
  .qcar{--qgap:24px;--qpeek:14%;position:relative}
  .qtrack{display:flex;gap:var(--qgap);overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x mandatory;padding:6px 0 10px;scrollbar-width:none;outline:none}
  .qtrack::-webkit-scrollbar{display:none}
  .qtrack.drag{scroll-snap-type:none;user-select:none;-webkit-user-select:none}
  .qcard{cursor:grab}
  .qcard p,.qcard figcaption{cursor:auto}
  .qtrack.drag,.qtrack.drag *{cursor:grabbing}
  .qtrack:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
  .qcard{flex:0 0 calc((100% - var(--qgap) * 2 - var(--qpeek)) / 3);scroll-snap-align:start;background:var(--paper);padding:26px 26px 22px;border-top:2px solid var(--sand);display:flex;flex-direction:column;min-height:300px;transition:opacity .45s var(--ease)}
  .qcard.dim{opacity:.42}
  .qtrack.nofx .qcard{transition:none}
  .qcard.clone{}
  .qcard::before{content:"\201C";font-family:"Cormorant Garamond",Georgia,serif;font-size:64px;line-height:.6;color:var(--sand);display:block;margin-bottom:12px}
  .qcard p{font-size:15px;color:var(--ink-soft);margin-bottom:16px;flex:1}
  .qcard.soon p{font-style:italic;color:var(--ink-soft)}
  .qcard b{display:block;font-weight:500;font-size:15px}
  .qcard span{font-size:13px;color:var(--ink-soft)}
  .qbtn{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border-radius:50%;border:1px solid rgba(46,58,72,.35);background:rgba(241,242,240,.92);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(35,45,56,.12);transition:background .3s,color .3s,border-color .3s}
  .qbtn.prev{left:-23px}.qbtn.next{right:-23px}
  @media(max-width:700px){.qbtn.prev{left:-8px}.qbtn.next{right:-8px}}
  .qbtn:hover{background:var(--navy);color:var(--paper);border-color:var(--navy)}
  @media(max-width:1100px){.qcard{flex-basis:calc((100% - var(--qgap) - var(--qpeek)) / 2)}}
  @media(max-width:700px){.qcar{--qpeek:12%;--qgap:14px}.qcard{flex-basis:calc(100% - var(--qpeek));min-height:0}}
  @media(prefers-reduced-motion:reduce){.qcard{transition:none}.qtrack{scroll-behavior:auto}}
  .cta{padding:clamp(70px,12vh,130px) 0;text-align:center}
  .cta h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:var(--fs-cta);line-height:1.1;max-width:18ch;margin:0 auto 28px}
  .cta h2 em{font-style:normal;color:var(--ink-soft)}
  .btn{display:inline-flex;align-items:center;gap:12px;text-decoration:none;color:var(--paper);background:var(--navy);padding:16px 28px;font-size:13px;letter-spacing:.22em;text-transform:uppercase;font-weight:400;transition:background .3s,gap .3s}
  .btn:hover{background:var(--navy-deep);gap:18px}
  .btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .btn.ghost:hover{background:var(--ink);color:var(--paper)}

  /* ============ PROJETOS: grid 3x3 uniforme; sobras (1 ou 2) preenchem a última linha ============ */
  .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(14px,2vw,26px);padding-bottom:var(--sp-page)}
  .card-wrap{grid-column:span 2;min-width:0}
  .card-wrap.rem1{grid-column:span 6}.card-wrap.rem1 .card{aspect-ratio:16/6.4}
  .card-wrap.rem2{grid-column:span 3}.card-wrap.rem2 .card{aspect-ratio:16/9.6}
  @media(max-width:1000px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card-wrap,.card-wrap.rem1,.card-wrap.rem2{grid-column:span 1}.card-wrap.rem1 .card,.card-wrap.rem2 .card{aspect-ratio:4/3}
    .grid .card-wrap.first-odd{grid-column:span 2}.grid .card-wrap.first-odd .card{aspect-ratio:16/8}}
  @media(max-width:560px){.grid{grid-template-columns:1fr}.grid .card-wrap.first-odd{grid-column:span 1}.grid .card-wrap.first-odd .card{aspect-ratio:4/3}}
  .card{position:relative;display:block;text-decoration:none;color:inherit;overflow:hidden;background:#E4E8EA;aspect-ratio:4/3}
  .card img{width:100%;height:100%;object-fit:cover}
  .card-veil{position:absolute;inset:0;background:rgba(35,45,56,0);transition:background .55s var(--ease)}
  .card-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:0 20px;text-align:center;pointer-events:none}
  .card-mark{position:relative;width:34px;height:34px;flex:0 0 auto}
  .card-mark i{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--paper);opacity:0;transition:transform .55s var(--ease),opacity .45s var(--ease)}
  .card-mark i:nth-child(1){left:0;top:0;transform:translate(-22px,-22px)}
  .card-mark i:nth-child(2){right:0;top:0;transform:translate(22px,-22px)}
  .card-mark i:nth-child(3){left:0;bottom:0;border-radius:0 0 0 16px;transform:translate(-22px,22px)}
  .card-mark i:nth-child(4){right:0;bottom:0;border-radius:0 0 16px 0;transform:translate(22px,22px)}
  .card-txt{color:var(--paper);transform:translateY(12px);opacity:0;transition:opacity .5s var(--ease) .12s,transform .5s var(--ease) .12s}
  .card-txt b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:var(--fs-card);line-height:1.05}
  .card-txt span{display:block;font-size:11px;letter-spacing:.26em;text-transform:uppercase;margin-top:8px;color:var(--sand)}
  .card:hover .card-veil,.card:focus-visible .card-veil{background:rgba(35,45,56,.55)}
  .card:hover .card-mark i,.card:focus-visible .card-mark i{opacity:.92;transform:translate(0,0)}
  .card:hover .card-mark i:nth-child(1),.card:focus-visible .card-mark i:nth-child(1){opacity:.55}
  .card:hover .card-mark i:nth-child(4),.card:focus-visible .card-mark i:nth-child(4){opacity:.4}
  .card:hover .card-txt,.card:focus-visible .card-txt{opacity:1;transform:translateY(0)}
  .card-cap{display:none}
  /* toque (sem hover): o estado "hover" fica permanente — imagem escurecida, marca e nome sobre a imagem */
  html.touch .card-veil{background:rgba(35,45,56,.5)}
  html.touch .card-mark i{opacity:.92;transform:translate(0,0)}
  html.touch .card-mark i:nth-child(1){opacity:.55}html.touch .card-mark i:nth-child(4){opacity:.4}
  html.touch .card-txt{opacity:1;transform:translateY(0)}

  /* ============ PROJETO: ficha + galeria ============ */
  .proj-top{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(28px,5vw,80px);align-items:start;padding-bottom:clamp(36px,6vh,60px)}

  .share{margin-top:26px;border-top:1px solid var(--line);padding-top:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .share > span{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin-right:8px}
  .share-row{display:flex;align-items:center;gap:4px;flex-wrap:nowrap}
  @media(max-width:640px){.share > span{flex-basis:100%;margin:0 0 4px}.share a,.share button{width:36px;height:36px}}
  .share a,.share button{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;color:var(--ink);border-radius:50%;transition:background .3s,color .3s}
  .share a:hover,.share button:hover{background:var(--navy);color:var(--paper)}
  .share svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .share .toast{font-size:13px;color:var(--ink-soft);margin-left:6px;opacity:0;transition:opacity .3s}
  .share .toast.on{opacity:1}
  /* galeria "justificada" (Flickr/Google Fotos): linhas de altura variável, proporção natural, sem buracos nem cortes */
  .gal{--ggap:clamp(10px,1.6vw,18px);display:flex;flex-wrap:wrap;gap:var(--ggap);padding-bottom:clamp(50px,8vh,90px);align-content:flex-start}
  .gal button{display:block;flex:0 0 auto;overflow:hidden;background:#E4E8EA;cursor:zoom-in;width:calc(50% - var(--ggap)/2)}
  .gal img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .5s}
  .gal button:hover img{opacity:.88}
  .gal button:focus-visible{outline:2px solid var(--navy);outline-offset:3px}
  .pn{display:flex;justify-content:space-between;gap:20px;border-top:1px solid var(--line);padding:26px 0 var(--sp-page)}
  .pn a{text-decoration:none;color:inherit;max-width:46%}
  .pn a small{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .pn a b{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:var(--fs-pn);line-height:1.1;transition:color .3s}
  .pn a:hover b{color:var(--ink-soft)}
  .pn a.next{text-align:right;margin-left:auto}

  .pswp{--pswp-bg:#000;--pswp-root-z-index:100;font-family:"Jost",system-ui,sans-serif}
  .pswp__button{color:#fff}
  .pswp__button--close,.pswp__button--zoom{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);margin:14px 14px 0 0;display:flex;align-items:center;justify-content:center}
  .pswp__button--close:hover,.pswp__button--zoom:hover{background:rgba(0,0,0,.7)}
  .pswp__button--arrow{width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.22);top:50%;margin-top:-26px;left:16px;transition:background .3s,transform .3s}
  .pswp__button--arrow--next{left:auto;right:16px}
  .pswp__button--arrow:hover{background:rgba(0,0,0,.7)}
  .pswp__button--arrow--prev:hover{transform:translateX(-3px)}.pswp__button--arrow--next:hover{transform:translateX(3px)}
  .pswp__button--arrow .pswp__icn{display:none}
  .pswp__button--arrow::before{content:"";position:absolute;left:50%;top:50%;width:12px;height:12px;border-left:1.6px solid #fff;border-bottom:1.6px solid #fff;transform:translate(-35%,-50%) rotate(45deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .pswp__button--arrow--next::before{transform:translate(-65%,-50%) rotate(-135deg)}
  .pswp__icn{width:26px;height:26px;top:13px;left:13px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6))}
  .pswp__button:focus-visible{outline:2px solid #fff;outline-offset:2px}
  .pswp__top-bar{background:none;height:80px}
  .pswp__counter{display:none}
  .gp-cap{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.75);pointer-events:none;padding:0 16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gp-cap b{font-weight:400;color:#fff;margin-right:14px;font-variant-numeric:tabular-nums}
  .pswp--ui-visible .gp-cap{opacity:1;transition:opacity .3s}.pswp:not(.pswp--ui-visible) .gp-cap{opacity:0}
  @media(max-width:640px){.pswp__button--close,.pswp__button--zoom{width:44px;height:44px;margin:10px 10px 0 0}.pswp__icn{width:24px;height:24px;top:10px;left:10px}}

  /* ============ TRANSIÇÕES DE PÁGINA E ENTRADAS ============ */
  /* véu de troca de página: só a tela é composta (nunca a página inteira) */
  .veil{position:fixed;inset:0;z-index:40;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .18s var(--ease)}
  .veil.dark{background:var(--navy-deep)}
  .veil.on{opacity:1;pointer-events:auto;transition-duration:.14s}
  .veil.off{transition-duration:.34s}
  @keyframes pg-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  main.pg-in .page-head{animation:pg-in .5s var(--ease) both}
  .hero-content > *{animation:rise .9s var(--ease) both}
  .replay .hero-content > *,.replay .hero-foot,.replay .rail{animation:none}
  .hero-content > :nth-child(2){animation-delay:.12s}
  .hero-content > :nth-child(3){animation-delay:.24s}
  .hero-foot,.rail{animation:fadein 1s var(--ease) .5s both}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .rv{transition-delay:var(--d,0ms)}
  .card img{transition:transform 1.4s var(--ease)}
  .btn svg{transition:transform .3s var(--ease)}
  .btn:hover svg{transform:translateX(4px)}
  @media(prefers-reduced-motion:reduce){
    main.pg-in .page-head,.hero-content > *,.hero-foot,.rail{animation:none}
    .veil{transition:none}
    .rv{transition-delay:0ms}
  }

  /* ============ CONTATO ============ */
  .contact{text-align:center;padding-bottom:var(--sp-page)}
  .contact .page-head h1,.contact .page-head p{margin-left:auto;margin-right:auto}
  .contact .page-head h1{text-wrap:initial;font-size:calc(var(--fs-page) * .72)}
  .contact .page-head{padding-bottom:0}
  @media(min-width:861px){.contact .page-head{padding-top:calc(var(--hdr-h) + 40px)}.contact br.mb{display:none}}
  .contact .page-head p{margin-top:8px;font-size:15px}
  @media(max-width:640px){.contact .page-head h1{font-size:34px}}
  .cgrid{max-width:1100px;margin:clamp(20px,3.5vh,40px) auto 0;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,7fr);gap:clamp(36px,7vw,110px);align-items:start;text-align:left}
  .cgrid .form-head{margin:0 0 18px}
  .c-list{list-style:none;margin-top:6px}
  .c-list li{border-bottom:1px solid var(--line)}
  .c-list li:first-child{border-top:1px solid var(--line)}
  .c-list a{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px 4px;text-decoration:none;color:var(--ink);transition:color .3s}
  .c-list a:hover span{color:var(--ink-soft)}
  .c-list small{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:var(--ink-soft)}
  .c-list span{font-size:17px}
  .form-head{margin:clamp(48px,7vh,72px) 0 22px}
  .form-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:var(--fs-form);line-height:1.15}
  .form-head p{color:var(--ink-soft);font-size:15px;margin-top:8px}
  form{text-align:left;display:grid;gap:12px}
  .f2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:560px){.f2{grid-template-columns:1fr}}
  @media(max-width:860px){
    .cgrid{grid-template-columns:1fr;gap:28px;text-align:center}
    .cinfo .form-head p{display:none}
    .c-list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
    .c-list li,.c-list a{min-width:0}
    .c-list li,.c-list li:first-child{border:1px solid var(--line)}
    .c-list a{align-items:center;padding:12px 8px;gap:2px}
    .c-list span{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
    .cgrid form{text-align:left}
  }
  .fld{display:flex;flex-direction:column;gap:6px}
  .fld label{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);font-weight:400}
  .fld label b{color:var(--ink);font-weight:400}
  .fld input,.fld select,.fld textarea{font:inherit;font-weight:300;font-size:16px;color:var(--ink);background:#FAFBFA;border:1px solid var(--line);border-radius:0;padding:10px 14px;min-height:44px;transition:border-color .25s,box-shadow .25s;width:100%;-webkit-appearance:none;appearance:none}
  .fld select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(135deg,var(--ink-soft) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 14px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
  .fld textarea{min-height:96px;resize:vertical}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--navy);box-shadow:0 0 0 3px rgba(46,58,72,.15)}
  .fld.err input,.fld.err textarea,.fld.err select{border-color:#B93A24}
  .fld .msg{font-size:13px;color:#B93A24;min-height:0;display:none}
  .fld.err .msg{display:block}
  .consent{display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--ink-soft);line-height:1.5}
  .consent input{width:18px;height:18px;margin-top:3px;flex:none;accent-color:var(--navy)}
  .consent.err{color:#B93A24}
  .hp{position:absolute;left:-9999px;opacity:0;height:0;overflow:hidden}
  .f-actions{display:flex;flex-direction:row;align-items:center;gap:18px;margin-top:2px}
  @media(max-width:560px){.f-actions{flex-direction:column;gap:10px}}
  .f-actions .btn{min-width:240px;justify-content:center}
  .f-actions .btn[disabled]{opacity:.6;cursor:progress}
  .f-note{font-size:13px;color:var(--ink-soft);text-align:left}
  .f-fail{margin-top:14px;padding:12px 14px;border:1px solid #B93A24;color:#8A2A18;font-size:15px}.f-fail a{color:inherit}
  .f-ok{display:none;border:1px solid var(--line);padding:28px 24px;text-align:center}
  .f-ok.on{display:block}
  .f-ok b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:28px;margin-bottom:8px}
  .f-ok p{color:var(--ink-soft);font-size:15px}

  /* toast global (fallback de links quando o site roda dentro de um iframe com sandbox, como no artefato) */
  .gtoast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,12px);z-index:95;background:var(--navy-deep);color:var(--paper);font-size:13px;letter-spacing:.04em;padding:12px 18px;border-radius:999px;box-shadow:0 8px 30px rgba(35,45,56,.3);opacity:0;pointer-events:none;transition:opacity .3s var(--ease),transform .3s var(--ease);max-width:calc(100vw - 32px);text-align:center}
  .gtoast.on{opacity:1;transform:translate(-50%,0)}
  @media(prefers-reduced-motion:reduce){.gtoast{transition:none}}

  /* ============ FOOTER ============ */
  .ftr{background:var(--navy-deep);color:var(--paper);position:relative;overflow:clip;padding:0 var(--gutter)}
  .ftr .shell{padding-inline:0}
  .ftr::before{content:"";position:absolute;width:30vw;height:30vw;max-width:360px;max-height:360px;border-radius:50% 50% 0 50%;background:var(--navy);right:-8vw;bottom:-14vw;opacity:.7;pointer-events:none}
  .ftr-grid{position:relative;display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(24px,4vw,60px);padding:28px 0 22px;align-items:center}
  .ftr-brand{display:flex;flex-direction:column;gap:0}
  .ftr-brand .brand{color:var(--paper)}
    .ftr-cau{text-align:center}
  .ftr-cau b{display:block;font-family:Jost,"Century Gothic",Futura,sans-serif;font-weight:400;font-size:13px;letter-spacing:.12em;color:rgba(242,239,233,.85);font-variant-numeric:lining-nums tabular-nums}
  .ftr-cau span{display:block;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--sand);margin-top:6px}
  .ftr-right{display:flex;flex-direction:column;align-items:flex-end;gap:16px}
  .ftr-soc{display:flex;gap:4px}
  .ftr-soc a{display:flex;align-items:center;justify-content:center;width:40px;height:40px;color:rgba(242,239,233,.75);border-radius:50%;transition:color .3s,background .3s}
  .ftr-soc a:hover{color:var(--paper);background:rgba(242,239,233,.08)}
  .ftr-soc svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .ftr-soc a span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ftr-bottom{position:relative;border-top:1px solid var(--line-light);padding:16px 0 22px;display:flex;justify-content:center;align-items:center;gap:10px 22px;flex-wrap:wrap;font-size:13px;letter-spacing:.02em;color:rgba(242,239,233,.72);text-align:center}
  .ftr-bottom a{color:inherit;text-decoration:none;display:inline-block;padding:4px 0;line-height:inherit;transition:color .25s}
  .ftr-bottom > span{display:inline-block;padding:4px 0}
  .ftr-brand .brand-txt{text-align:left}
  .ftr-bottom a:hover{color:var(--paper)}
  .ftr-bottom .rights::before{content:"·";margin-right:22px;opacity:.6}
  @media(max-width:640px){.ftr-bottom{flex-direction:column;gap:6px}.ftr-bottom .rights::before{content:none}}
  @media(max-width:820px){
    .ftr-grid{grid-template-columns:1fr;text-align:center;justify-items:center;gap:14px;padding:24px 0 18px}
    .ftr-brand{align-items:center}
    .ftr-right{align-items:center}
  }
  @media(prefers-reduced-motion:reduce){
    .hero-img,.scrollcue b{animation:none}
    .rv{opacity:1;transform:none;transition:none}
    .card img,.gal img,.lb img,.card-mark i,.card-txt,.card-veil{transition:none}
  }

/* ===== roteador ===== */
const main=$('#main'), hdr=$('#hdr');
let currentGallery=[], currentTitle='';
function route(){
  lbClose();
  const h=location.hash.replace(/^#\/?/,''), parts=h.split('/').filter(Boolean);
  let name='home', html;
  if(parts[0]==='projetos'){name='projetos';html=pages.projetos();}
  else if(parts[0]==='projeto'){name='projeto';html=pages.projeto(parts[1]||'');}
  else if(parts[0]==='contato'){name='contato';html=pages.contato();}
  else if(parts.length===0){html=pages.home();}
  else {name='nf';html=pages.nf();}
  const key=name==='projeto'?'projeto:'+(parts[1]||''):name;
  const prev=document.body.dataset.page, first=!prev;
  const show=()=>{
    let node=pageCache.get(key);
    if(!node){node=document.createElement('div');node.className='page';node.innerHTML=html;pageCache.set(key,node);}
    // reveals recomeçam a cada visita
    node.querySelectorAll('.rv.in').forEach(el=>el.classList.remove('in'));
    main.replaceChildren(node);
    document.body.dataset.page=name;
    window.scrollTo({top:0,behavior:'instant'});
    if(!node.dataset.bound){bindPage(name, parts[1]);node.dataset.bound='1';}
    if(name==='projeto'){const pp=PROJECTS.find(x=>x.slug===parts[1]);if(pp){currentGallery=pp.gallery;currentTitle=pp.title;}}
    if(name==='contato'){const f=node.querySelector('#cf');if(f&&f.hidden){f.hidden=false;f.reset();node.querySelector('#f-ok').classList.remove('on');node.querySelectorAll('.fld.err').forEach(x=>x.classList.remove('err'));}}
    // hero: repete a entrada quando a Home é reaberta
    if(name==='home'&&!first){node.classList.add('replay');void node.offsetWidth;node.classList.remove('replay');}
    reveal();
    main.classList.remove('pg-in');if(name!=='home'&&!first&&!REDUCED){void main.offsetWidth;main.classList.add('pg-in');}
  };
  if(first||REDUCED){show();pageTransitioning=false;syncHdr();}
  else{
    // véu cobre a tela (140ms) -> troca por baixo -> véu sai (340ms). Só uma camada do tamanho da tela é animada.
    const dark=(name==='home'||prev==='home');   // Home envolvida: véu na cor do hero, header pode ficar transparente sobre ele
    veil.classList.toggle('dark', dark);
    hdr.classList.add('snap'); pageTransitioning=!dark; syncHdr(); void getComputedStyle(hdr).backgroundColor; hdr.classList.remove('snap');
    veil.classList.remove('off');veil.classList.add('on');
    let swapped=false;
    const doSwap=()=>{if(swapped)return;swapped=true;
      hdr.classList.add('snap');                    // estado do header muda escondido pelo véu, sem fade
      show();
      pageTransitioning=(name!=='home'&&!dark)?true:false; syncHdr();
      void getComputedStyle(hdr).backgroundColor;      // aplica o estado agora (sem transição), antes de liberar o véu
      requestAnimationFrame(()=>{hdr.classList.remove('snap');veil.classList.add('off');veil.classList.remove('on');});};
    const endT=(e)=>{if(e&&(e.target!==veil||e.propertyName!=='opacity'))return;
      if(veil.classList.contains('on')){doSwap();return;}            // véu terminou de cobrir -> troca
      if(veil.classList.contains('off')){veil.removeEventListener('transitionend',endT);clearTimeout(guard);pageTransitioning=false;syncHdr();}};
    const guard=setTimeout(()=>{doSwap();setTimeout(()=>{pageTransitioning=false;syncHdr();},400);},1400);
    veil.addEventListener('transitionend',endT);
    setTimeout(doSwap,260); // segurança caso o evento não venha
  }
  document.querySelectorAll('.nav a').forEach(a=>{const r=a.dataset.route; const on=(r===name)||(r==='projetos'&&name==='projeto'); if(on)a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current');});
  const p=PROJECTS.find(x=>x.slug===parts[1]);
  document.title=(name==='home'?'':(name==='projeto'&&p?p.title:name==='nf'?'Página não encontrada':name.charAt(0).toUpperCase()+name.slice(1))+' — ')+'Giordanna Pereira Arquitetura';
  syncMeta(name,p);
}

const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}}),{rootMargin:'0px 0px -8% 0px'}):null;
function reveal(){

}

/* ===== galeria justificada + lightbox (PhotoSwipe 5) ===== */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function layoutGallery(gal){
  const items=[...gal.children]; if(!items.length)return;
  const W=gal.clientWidth; if(!W)return;
  const gap=parseFloat(getComputedStyle(gal).columnGap)||12;
  const ar=items.map(b=>+b.dataset.ar||1.5);
  const target=W>=1000?380:W>=640?300:230;
  const rows=[]; let start=0;
  if(items[0].classList.contains('gal-hero')){rows.push([0]);start=1;}
  let row=[],sum=0;
  for(let i=start;i<items.length;i++){row.push(i);sum+=ar[i];if(sum*target+(row.length-1)*gap>=W){rows.push(row);row=[];sum=0;}}
  if(row.length)rows.push(row);
  const rowH=r=>(W-(r.length-1)*gap)/r.reduce((s,i)=>s+ar[i],0);
  // última linha alta demais (1 ou 2 imagens sobrando): puxa itens da linha anterior para equilibrar
  let guard=6;
  while(guard--&&rows.length>1){const L=rows[rows.length-1],P=rows[rows.length-2];if(rowH(L)<=target*1.45||P.length<3||(P.length===1&&P[0]===0))break;L.unshift(P.pop());}
  rows.forEach((r,ri)=>{
    let h=rowH(r), crop=false;
    if(r.length===1&&r[0]===0&&items[0].classList.contains('gal-hero')){h=Math.round(Math.min(W/ar[0],W*0.5));crop=true;}   // capa: faixa larga, cortada
    else if(h>target*1.45){h=Math.round(target*1.45);crop=true;}                                                      // resto: corte leve em vez de buraco
    h=Math.round(h);
    const avail=W-(r.length-1)*gap, total=r.reduce((s,i)=>s+ar[i],0);
    let used=0;
    r.forEach((i,j)=>{const w=j===r.length-1?avail-used:Math.floor(avail*ar[i]/total);used+=w;const b=items[i];b.style.width=w+'px';b.style.height=h+'px';b.style.aspectRatio='auto';b.dataset.cropped=(crop||Math.abs(w/h-ar[i])/ar[i]>0.02)?'1':'';});
  });
}
const galRO=('ResizeObserver' in window)?new ResizeObserver(es=>es.forEach(e=>layoutGallery(e.target))):null;
let pswpLightbox=null, pswpInst=null;
function initLightbox(){
  if(pswpLightbox||typeof PhotoSwipeLightbox==='undefined')return;
  pswpLightbox=new PhotoSwipeLightbox({pswpModule:PhotoSwipe,bgOpacity:1,loop:true,showHideAnimationType:'zoom',showAnimationDuration:380,hideAnimationDuration:320,easing:'cubic-bezier(.32,.72,0,1)',
    wheelToZoom:true,initialZoomLevel:'fit',secondaryZoomLevel:2,maxZoomLevel:4,imageClickAction:'zoom',tapAction:'toggle-controls',doubleTapAction:'zoom',
    padding:{top:24,bottom:64,left:20,right:20},arrowPrevTitle:'Foto anterior',arrowNextTitle:'Próxima foto',closeTitle:'Fechar',zoomTitle:'Ampliar',counter:false,
    returnFocus:true,trapFocus:true});
  // animação parte da miniatura da galeria (e respeita miniaturas cortadas)
  pswpLightbox.addFilter('thumbEl',(el,data,i)=>{const b=document.querySelectorAll('#gal button')[i];return b?b.querySelector('img'):el;});
  pswpLightbox.on('uiRegister',()=>{
    pswpLightbox.pswp.ui.registerElement({name:'gp-cap',className:'gp-cap',appendTo:'root',onInit:(el,pswp)=>{el.id='lb-cap';const upd=()=>{el.innerHTML=`<b id="lb-count">${pswp.currIndex+1} / ${pswp.getNumItems()}</b><span>${esc(currentTitle)}</span>`;};pswp.on('change',upd);upd();}});
  });
  pswpLightbox.on('beforeOpen',()=>{pswpInst=window.pswpInst=pswpLightbox.pswp;document.body.classList.add('lock');});
  pswpLightbox.on('firstUpdate',()=>{const el=pswpLightbox.pswp.element;if(el){el.setAttribute('aria-label','Galeria em tela cheia: '+currentTitle);el.setAttribute('lang','pt-BR');}});
  pswpLightbox.on('destroy',()=>{pswpInst=window.pswpInst=null;document.body.classList.remove('lock');});
  pswpLightbox.init();
}
function lbOpen(i){
  initLightbox(); if(!pswpLightbox)return;
  const btns=[...document.querySelectorAll('#gal button')];
  const data=currentGallery.map((k,n)=>{const d=DIMS[k]||[1200,800];return {src:LARGE[k]||IMG[k],srcset:SRCSET[k]||undefined,width:d[0],height:d[1],alt:currentTitle+' — imagem '+(n+1),thumbCropped:!!(btns[n]&&btns[n].dataset.cropped)};});
  pswpLightbox.loadAndOpen(i,data);
}
function lbClose(){const i=pswpInst;if(!i)return;if(i.opener&&i.opener.isOpen)i.close();else i.on('openingAnimationEnd',()=>i.close()); // ainda abrindo: fecha assim que a abertura terminar
}

/* ===== ligações por página ===== */
function bindQuotes(root){
  const track=root.querySelector('.qtrack'), btns=[...root.querySelectorAll('.qbtn')];
  const real=[...track.children], N=real.length;
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  // loop infinito: clones nas duas pontas; ao parar sobre um clone, salta (sem animação) para o card real equivalente
  const C=N; // clona a lista inteira nas duas pontas: sempre há espaço para rolar além da última antes do salto
  const mk=c=>{const k=c.cloneNode(true);k.classList.add('clone');k.setAttribute('aria-hidden','true');k.toggleAttribute('inert',true);return k;};
  real.slice(-C).reverse().forEach(c=>track.insertBefore(mk(c),track.firstChild)); // ordem preservada: [...N-3, N-2, N-1] antes do primeiro
  real.slice(0,C).forEach(c=>track.appendChild(mk(c)));
  const cards=[...track.children];
  const step=()=>cards[1].offsetLeft-cards[0].offsetLeft;
  const realStart=()=>cards[C].offsetLeft-cards[0].offsetLeft, span=()=>N*step();
  let raf=0, jumping=false, tmr=0;
  const dimUpdate=()=>{
    const sl=track.scrollLeft, cw=track.clientWidth;
    cards.forEach(c=>{const l=c.offsetLeft-cards[0].offsetLeft-sl, r=l+c.offsetWidth; const d=l<-6||r>cw+6; c.classList.toggle('dim',d); if(!c.classList.contains('clone')){c.setAttribute('aria-hidden',d?'true':'false');c.toggleAttribute('inert',d);}});
  };
  let pointerActive=false; // dedo ou botão do mouse pressionado: nunca saltar no meio do gesto
  const settle=()=>{ // fim de rolagem: normaliza a posição para dentro da faixa real
    if(pointerActive){clearTimeout(tmr);tmr=setTimeout(settle,120);return;}
    const sl=track.scrollLeft, a=realStart(), s=span();
    let jumped=false;
    if(sl<a-2){jumping=true;track.scrollLeft=sl+s;jumping=false;jumped=true;}
    else if(sl>=a+s-2){jumping=true;track.scrollLeft=sl-s;jumping=false;jumped=true;}
    if(jumped){track.classList.add('nofx');dimUpdate();void track.offsetWidth;requestAnimationFrame(()=>track.classList.remove('nofx'));} // salto invisível: estados aplicados sem transição
    else dimUpdate();
  };
  track.addEventListener('touchstart',()=>{pointerActive=true;},{passive:true});
  const touchEnd=()=>{pointerActive=false;clearTimeout(tmr);tmr=setTimeout(settle,120);};
  track.addEventListener('touchend',touchEnd,{passive:true});track.addEventListener('touchcancel',touchEnd,{passive:true});
  track.addEventListener('scroll',()=>{if(jumping)return;if(!raf)raf=requestAnimationFrame(()=>{raf=0;dimUpdate();});clearTimeout(tmr);tmr=setTimeout(settle,90);},{passive:true});
  if('onscrollend' in window)track.addEventListener('scrollend',settle);
  addEventListener('resize',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;dimUpdate();});});
  const idx=()=>Math.round((track.scrollLeft-realStart())/step()); // índice real (pode ficar fora de 0..N-1 antes do settle)
  const goTo=i=>{track.scrollTo({left:realStart()+i*step(),behavior:reduce?'auto':'smooth'});};
  const move=d=>{clearTimeout(tmr);settle();goTo(idx()+d);};
  btns.forEach(b=>b.addEventListener('click',()=>move(+b.dataset.dir)));
  track.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();move(1);}if(e.key==='ArrowLeft'){e.preventDefault();move(-1);}});
  // Arraste com mouse (toque já usa o scroll nativo com inércia). Meio-termo: a superfície do card mostra a mão e
  // arrasta; o texto mostra o cursor de texto e é selecionável com o mouse. O arraste engata após 8px; a partir daí
  // cursor "grabbing", seleção bloqueada e o clique final é cancelado.
  let down=false,dragging=false,sx=0,sl=0,moved=false;
  const TH=8;
  const onText=el=>!!(el&&el.closest&&el.closest('.qcard p,.qcard figcaption'));
  track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||onText(e.target))return;down=true;pointerActive=true;dragging=false;moved=false;sx=e.clientX;sl=track.scrollLeft;});
  track.addEventListener('pointermove',e=>{
    if(!down)return;const dx=e.clientX-sx;
    if(!dragging){if(Math.abs(dx)<TH)return;dragging=true;moved=true;track.classList.add('drag');try{track.setPointerCapture(e.pointerId);}catch(_){}const s=getSelection();if(s&&s.rangeCount)s.removeAllRanges();}
    track.scrollLeft=sl-dx;
  });
  const end=()=>{if(!down)return;down=false;pointerActive=false;if(dragging){dragging=false;track.classList.remove('drag');goTo(idx());}else{clearTimeout(tmr);tmr=setTimeout(settle,120);}};
  track.addEventListener('pointerup',end);track.addEventListener('pointercancel',end);track.addEventListener('lostpointercapture',end);
  track.addEventListener('mousemove',e=>{if(dragging)e.preventDefault();});
  track.addEventListener('selectstart',e=>{if(dragging)e.preventDefault();});
  track.addEventListener('dragstart',e=>e.preventDefault());
  track.addEventListener('click',e=>{if(moved){e.preventDefault();e.stopPropagation();moved=false;}},true);
  // posição inicial: primeiro card real, sem animação
  jumping=true;track.scrollLeft=realStart();jumping=false;dimUpdate();
}
function bindPage(name, slug){
  if(name==='home'){const q=$('#qcar');if(q)bindQuotes(q);}
  if(name==='projeto'){
    const p=PROJECTS.find(x=>x.slug===slug); if(!p)return;
    currentGallery=p.gallery; currentTitle=p.title;
    const gal=$('#gal'); gal.addEventListener('click',e=>{const b=e.target.closest('button[data-i]');if(b)lbOpen(+b.dataset.i);});
    layoutGallery(gal); if(galRO)galRO.observe(gal);
    const nat=$('#sh-native');
    if(navigator.share){nat.hidden=false;nat.onclick=()=>navigator.share({title:p.title+' — Giordanna Pereira Arquitetura',url:location.href}).catch(()=>{});}
    $('#sh-copy').onclick=async()=>{const t=$('#sh-toast');try{await navigator.clipboard.writeText(location.href);t.textContent='Link copiado';}catch(_){t.textContent=location.href;}t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2200);};
  }
  if(name==='contato'){
    const f=$('#cf');
    const fields=[['nome',v=>v.trim().length>1],['email',v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())],['assunto',v=>!!v],['msg',v=>v.trim().length>=10]];
    const check=(id,fn,show)=>{const el=$('#f-'+id),ok=fn(el.value);const w=el.closest('.fld');if(show||w.classList.contains('err'))w.classList.toggle('err',!ok);el.setAttribute('aria-invalid',ok?'false':'true');return ok;};
    fields.forEach(([id,fn])=>{const el=$('#f-'+id);el.addEventListener('blur',()=>check(id,fn,true));el.addEventListener('input',()=>check(id,fn,false));});
    f.addEventListener('submit',e=>{
      e.preventDefault();
      let ok=true, first=null;
      fields.forEach(([id,fn])=>{if(!check(id,fn,true)){ok=false;first=first||$('#f-'+id);}});
      const c=$('#f-consent'); $('#consent-w').classList.toggle('err',!c.checked); if(!c.checked){ok=false;first=first||c;}
      if(!ok){first.focus();return;}
      if(f.empresa.value)return; // honeypot
      const b=$('#f-send'); b.disabled=true; b.textContent='Enviando…';
      const done=()=>{f.hidden=true;$('#f-ok').classList.add('on','in');$('#f-ok').focus?.();};
      const fail=()=>{b.disabled=false;b.innerHTML='Enviar mensagem '+ICO.arrow;const n=$('#f-fail');n.hidden=false;n.focus?.();};
      if(!FORM_ENDPOINT){setTimeout(done,700);return;} // sem backend configurado: apenas simula
      fetch(FORM_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','Accept':'application/json'},body:new URLSearchParams(new FormData(f)).toString()})
        .then(r=>r.ok?done():fail()).catch(fail);
    });
  }
}

/* ===== links externos e e-mail dentro de iframe com sandbox (ex.: pré-visualização no artefato) =====
   O sandbox do host não permite abrir novas abas nem protocolos externos (mailto:). Padrão de mercado para o caso:
   tentar abrir; se for bloqueado, copiar o endereço para a área de transferência e avisar. No site publicado nada muda. */
const EMBEDDED=(()=>{try{return self!==top;}catch(_){return true;}})();
let gtoastEl=null,gtoastT=0;
function gtoast(msg){if(!gtoastEl){gtoastEl=document.createElement('div');gtoastEl.className='gtoast';gtoastEl.setAttribute('role','status');gtoastEl.setAttribute('aria-live','polite');document.body.appendChild(gtoastEl);}gtoastEl.textContent=msg;gtoastEl.classList.add('on');clearTimeout(gtoastT);gtoastT=setTimeout(()=>gtoastEl.classList.remove('on'),2800);}
async function copyText(s){try{await navigator.clipboard.writeText(s);return true;}catch(_){try{const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok;}catch(__){return false;}}}
document.addEventListener('click',e=>{
  if(!EMBEDDED)return;
  const a=e.target.closest('a[href]'); if(!a||e.defaultPrevented)return;
  const href=a.getAttribute('href')||'';
  if(href.startsWith('mailto:')){
    e.preventDefault();
    const addr=href.slice(7).split('?')[0];
    if(addr){copyText(addr).then(ok=>gtoast(ok?'E-mail copiado: '+addr:addr));}
    else{copyText(location.href).then(ok=>gtoast(ok?'Link copiado para compartilhar por e-mail':location.href));}
    return;
  }
  if(a.target==='_blank'&&/^https?:/.test(href)){
    e.preventDefault();
    let w=null; try{w=window.open(href,'_blank','noopener');}catch(_){w=null;}
    if(!w){copyText(href).then(ok=>gtoast(ok?'Link copiado — cole em uma nova aba':href));}
  }
},true);
