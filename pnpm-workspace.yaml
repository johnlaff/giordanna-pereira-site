allowBuilds:
  '@mdn/mdn-http-observatory': false
  esbuild: true
  libpq: false
  node_extra_ca_certs_mozilla_bundle: false
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260918.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260918.1'
  - '@cloudflare/workerd-linux-64@1.20260918.1'
  - '@cloudflare/workerd-linux-arm64@1.20260918.1'
  - '@cloudflare/workerd-windows-64@1.20260918.1'
  - miniflare@5.20260918.0-alpha
  - workerd@1.20260918.1
  - wrangler@4.135.0
# Advisories altos sem versão corrigida publicada, fora do `pnpm audit` até sair a correção.
auditConfig:
  ignoreGhsas:
    # picomatch <=4.0.7 (ReDoS por extglob, via astro e @astrojs/cloudflare): só recebe padrões
    # de glob escritos no código, nunca texto de visitante. Tirar quando houver versão corrigida.
    - GHSA-fc5q-39xc-vjpf
# Versões forçadas em dependências transitivas com advisory alto e correção publicada.
overrides:
  miniflare>sharp: ^0.35.5
  miniflare>undici: ^7.30.2
  tmp: '>=0.2.7'
  # O emnapi fica na 1: a binding wasm do rolldown pede o 2.0.0-beta, o pnpm o repassa como
  # peer ao @astrojs/check, e com ele o `astro check` não carrega.
  '@emnapi/core': ^1.11.3
  '@emnapi/runtime': ^1.11.3
