# Dependências autorizadas a rodar scripts de instalação (pnpm bloqueia as demais). As três
# com `false` vêm com o HTTP Observatory (ADR 0013) e ficam barradas de propósito: os scripts
# delas baixam listas da internet a cada instalação, inclusive no Workers Builds, e o teste
# não precisa de nenhuma.
allowBuilds:
  '@mdn/mdn-http-observatory': false
  esbuild: true
  libpq: false
  node_extra_ca_certs_mozilla_bundle: false
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20260918.1'
  - '@cloudflare/workerd-darwin-arm64@1.20260918.1'
  - '@cloudflare/workerd-linux-64@1.20260918.1'
  - '@cloudflare/workerd-linux-arm64@1.20260918.1'
  - '@cloudflare/workerd-windows-64@1.20260918.1'
  - miniflare@5.20260918.0-alpha
  - workerd@1.20260918.1
  - wrangler@4.135.0
# Versões forçadas em dependências transitivas com advisory alto e correção publicada.
overrides:
  tmp: '>=0.2.6'
