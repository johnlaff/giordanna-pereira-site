# Orçamento de performance e acessibilidade (spec #3). Emulação mobile com throttling
# simulado, o perfil padrão do Lighthouse: é o cenário mais lento e o que o Google usa.
ci:
  collect:
    # Contra dist/ servido pelo Worker local, o mesmo runtime de Produção. Porta própria
    # para não colidir com o wrangler dev que o Playwright deixa aberto (8787).
    startServerCommand: pnpm exec wrangler dev --port 8788
    startServerReadyPattern: Ready on
    startServerReadyTimeout: 60000
    url:
      # Cada ticket que cria página acrescenta a rota aqui, como em tests/e2e/rotas.ts.
      - http://localhost:8788/
      - http://localhost:8788/projetos/consultorio-ginecocare
    numberOfRuns: 3
    settings:
      # O Chromium do Playwright não tem o sandbox setuid e o Ubuntu 24.04 do runner bloqueia
      # user namespaces sem privilégio; sem a flag o zygote aborta com "No usable sandbox".
      chromeFlags: --no-sandbox
  assert:
    assertions:
      largest-contentful-paint: [error, { maxNumericValue: 2500 }]
      cumulative-layout-shift: [error, { maxNumericValue: 0.1 }]
      categories:accessibility: [error, { minScore: 1 }]
      categories:performance: [warn, { minScore: 0.95 }]
  upload:
    target: filesystem
    outputDir: lighthouse-report
