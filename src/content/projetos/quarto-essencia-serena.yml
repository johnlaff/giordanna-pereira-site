titulo: Quarto Essência Serena
tipo: Residencial
capa: /src/assets/01-1.webp
descricao: A suíte foi concebida como um refúgio contemporâneo que integra quarto, closet e banheiro por meio de uma linguagem sofisticada, acolhedora e visualmente contínua. Linhas orgânicas, volumes curvos e marcenaria sob medida estruturam a composição, enquanto a paleta de tons neutros e terrosos, associada à madeira natural, superfícies marmorizadas, vidro e detalhes metálicos, cria uma atmosfera equilibrada e atemporal. A iluminação cênica, com perfis lineares, sancas e luz indireta, valoriza formas, painéis e nichos, ampliando a sensação de conforto e profundidade, ao mesmo tempo em que espelhos de grandes proporções favorecem a percepção espacial. O mobiliário integrado reúne funções como home office, penteadeira, armazenamento e entretenimento de maneira limpa e uniforme, resultando em um ambiente de luxo discreto, marcado pela harmonia entre proporção, textura, iluminação, funcionalidade e identidade.
ferramentas:
  - Sketchup
  - Layout
  - Enscape
