titulo: Quarto Bosque Encantado
tipo: Residencial
capa: /src/assets/001.webp
descricao: 'O Bosque Encantado é um quarto infantil concebido para unir acolhimento, funcionalidade e imaginação em uma atmosfera leve, delicada e afetiva. A marcenaria em madeira clara organiza o espaço de forma acessível e visualmente suave, enquanto o painel em aquarela transforma a parede em um cenário poético inspirado na natureza. A cama-casinha reforça a sensação de abrigo e segurança, e elementos como prateleiras e bancada estimulam autonomia, leitura, criatividade e descoberta. Com uma linguagem lúdica, natural e atemporal, o projeto cria mais do que um ambiente para dormir: constrói um pequeno refúgio infantil pensado para brincar, aprender e criar memórias afetivas.'
