titulo: Unidade Básica de Saúde
tipo: Hospitalar
capa: ../../assets/ubs-r04.webp
descricao: >-
  Unidade Básica de Saúde concebida a partir de princípios de humanização, pertencimento e
  adaptabilidade, organizada em torno de um pátio central que favorece a iluminação e a
  ventilação natural. O projeto adota sistemas modulares, estratégias passivas de conforto
  térmico e espaços destinados ao atendimento geral e específico da comunidade.
ferramentas:
  - Archicad
  - Enscape
