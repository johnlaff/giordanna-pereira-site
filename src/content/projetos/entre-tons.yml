titulo: Entre Tons
tipo: Residencial
capa: /src/assets/captura-de-tela-2026-09-27-205417.webp
descricao: |-
  A reforma da sala e cozinha parte de uma proposta contemporânea e marcante, em que cores e materiais expressivos assumem protagonismo e conferem personalidade ao projeto. A combinação entre tons profundos, verdes suaves, superfícies claras e texturas de destaque cria contrastes elegantes e uma atmosfera sofisticada, sem perder a sensação de acolhimento.

  A marcenaria foi pensada como parte ativa do cotidiano, organizando, armazenando e integrando funções de maneira prática e fluida, ao mesmo tempo em que estrutura visualmente os ambientes. Sala e cozinha passam a funcionar de forma conectada, formando um espaço versátil, funcional e cheio de identidade, onde cada escolha estética também responde às necessidades reais de quem vive a casa.
ferramentas:
