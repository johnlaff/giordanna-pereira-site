nome: Whallst Guibson
papel: Supervisor, WG Arquitetura
texto: >-
  Excelente profissional, que vem se destacando pela combinação de conhecimento técnico e
  criatividade em suas entregas. Demonstra atenção aos detalhes, capacidade de solucionar
  problemas e, ao mesmo tempo, apresenta ideias inovadoras e sensibilidade no desenvolvimento
  dos projetos. É uma estagiária dedicada, proativa e com grande potencial de crescimento na
  área de arquitetura.
