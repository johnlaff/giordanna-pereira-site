nome: Valquíria
papel: Supervisora, VISTAÈ | Projetos & Arquitetura
texto: |-
  Giordanna participou da nossa equipe me auxiliando no desenvolvimento de diversos projetos de arquitetura e interiores sob minha responsabilidade, entre eles o HPBT – Hot Park Bahia das Tartarugas e outros projetos do Grupo AVIVA, InCanto, Casa Horizonte e demais trabalhos desenvolvidos em parceria com o arquiteto Augusto Higa, além da Loja Mimou, no Shopping Singapura, em Caldas Novas – GO.
  Durante esse período, demonstrou responsabilidade, comprometimento com os prazos e facilidade no trabalho em equipe. Destacou-se especialmente no detalhamento de mobiliário, bancadas, granitos e elementos construtivos, executando suas atividades com cuidado e atenção.
  É uma profissional dedicada, responsável, receptiva às orientações e comprometida com a qualidade do trabalho, contribuindo de forma positiva para o desenvolvimento dos projetos em que atuou.
